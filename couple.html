<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeLink</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

<h1>Couple</h1>

<button onclick="location.href='index.html'"
class="back-btn">

<span class="material-symbols-outlined">
arrow_back
</span>

</button>

</header>

<div class="couple-container">

<div class="couple-card" onclick="createCouple()">

<span class="material-symbols-outlined">
key
</span>

<h3>コード発行</h3>

<p>カップルコードを作成</p>

</div>

<div class="couple-card">

<span class="material-symbols-outlined">
edit
</span>

<h3>コード入力</h3>

<input
type="text"
id="CoupleCode"
placeholder="例：ABC123">

</div>

<div class="couple-card" onclick="joinCouple()">

<span class="material-symbols-outlined">
favorite
</span>

<h3>リンク</h3>

<p>相手と接続する</p>

</div>

<div class="couple-card" onclick="unlinkCouple()">

<span class="material-symbols-outlined">
heart_broken
</span>

<h3>解除</h3>

<p>リンクを解除する</p>

</div>

</div>

<!-- オーバーレイ -->
<div id="overlay" onclick="closeMenu()"></div>

<!-- ボトムナビ -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="location.href='index.html'" aria-label="ホーム">
    <span class="material-symbols-outlined">home</span>
    <span class="nav-label">ホーム</span>
  </button>
  <button class="nav-btn" onclick="location.href='calendar.html'" aria-label="カレンダー">
    <span class="material-symbols-outlined">calendar_month</span>
    <span class="nav-label">カレンダー</span>
  </button>
  <button class="nav-btn" onclick="location.href='chat.html'" aria-label="チャット">
    <span class="material-symbols-outlined">chat</span>
    <span class="nav-label">チャット</span>
  </button>
  <button class="nav-btn" onclick="location.href='profile.html'" aria-label="プロフィール">
    <span class="material-symbols-outlined">person</span>
    <span class="nav-label">プロフィール</span>
  </button>
</nav>

<footer>
  <h3>TimeLink</h3>
  <p>Official Links</p>
  <div class="social-links">
    <a href="#" aria-label="LINE"><i class="fa-brands fa-line"></i></a>
    <a href="https://www.instagram.com/?hl=ja" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
    <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
  </div>
  <p>© TimeLink</p>
</footer>

<script type="module" src="script.js"></script>

</body>
</html>
